<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Souffle Bleu — Récap des résultats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060D1F; --panel:#0D1A38; --line:rgba(255,255,255,.15);
    --text:#FFFFFF; --muted:rgba(255,255,255,.62); --accent:#4FA8FF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Barlow',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 48px;display:flex;flex-direction:column;gap:18px}
  h1{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .canvas-wrap{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
  canvas{display:block;width:100%;height:auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
  label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number]{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0A1730;color:var(--text);font-size:16px;font-family:inherit;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .matches{display:flex;flex-direction:column;gap:10px}
  .match{
    display:grid;grid-template-columns:1fr 52px 12px 52px 1fr 34px;
    gap:6px;align-items:center;background:#0A1730;border:1px solid var(--line);
    border-radius:10px;padding:8px;
  }
  .match input{padding:8px 8px;font-size:14px;text-align:center}
  .match input.team{text-align:left}
  .match .vs{color:var(--muted);text-align:center;font-size:13px}
  .match .rm{
    background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;font-size:15px;line-height:1;padding:8px 0;font-family:inherit;
  }
  .addbtn{
    background:none;border:1px dashed var(--line);color:var(--muted);
    border-radius:10px;padding:12px;font-family:inherit;font-size:14px;cursor:pointer;
  }
  .download{
    width:100%;padding:16px;border-radius:12px;border:none;
    background:var(--accent);color:#06152F;font-family:'Anton',sans-serif;
    font-size:18px;letter-spacing:2px;cursor:pointer;
  }
  .status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>SOUFFLE BLEU — RÉCAP DES RÉSULTATS</h1>
    <p class="sub">Ajoutez chaque match (équipe 1, score, score, équipe 2), le visuel se met à jour en direct.</p>
  </div>

  <div class="canvas-wrap"><canvas id="cv" width="1080" height="1080"></canvas></div>

  <div class="panel">
    <div>
      <label for="titre">Titre</label>
      <input type="text" id="titre" value="RÉSULTATS DU WEEK-END">
    </div>
    <div>
      <label for="soustitre">Sous-titre</label>
      <input type="text" id="soustitre" placeholder="Ex : Journée 5 • 27-28 septembre">
    </div>

    <div>
      <label>Matchs</label>
      <div class="matches" id="matches"></div>
      <button type="button" class="addbtn" id="add" style="margin-top:10px;width:100%">+ Ajouter un match</button>
    </div>

    <button class="download" id="dl">Télécharger le visuel</button>
    <div class="status" id="status"></div>
  </div>
</div>

  const bgImg = new Image();
  bgImg.onload = function(){ draw(); };
  bgImg.src = BG_SRC;

  let matches = [
    {t1:'JAV Séniors', s1:84, s2:76, t2:'Rouen'},
    {t1:'JAV U18', s1:62, s2:70, t2:'Clermont'},
    {t1:'JAV U15', s1:55, s2:40, t2:'Moulins'}
  ];

  function renderRows(){
    matchesEl.innerHTML = '';
    matches.forEach(function(m, i){
      const row = document.createElement('div');
      row.className = 'match';
      row.innerHTML =
        '<input class="team" type="text" data-i="'+i+'" data-k="t1" value="'+escAttr(m.t1)+'" placeholder="Équipe 1">'+
        '<input type="number" data-i="'+i+'" data-k="s1" value="'+m.s1+'">'+
        '<div class="vs">–</div>'+
        '<input type="number" data-i="'+i+'" data-k="s2" value="'+m.s2+'">'+
        '<input class="team" type="text" data-i="'+i+'" data-k="t2" value="'+escAttr(m.t2)+'" placeholder="Équipe 2">'+
        '<button type="button" class="rm" data-i="'+i+'">✕</button>';
      matchesEl.appendChild(row);
    });
    matchesEl.querySelectorAll('input').forEach(function(inp){
      inp.addEventListener('input', function(){
        const i = parseInt(inp.getAttribute('data-i'),10);
        const k = inp.getAttribute('data-k');
        matches[i][k] = (k==='s1'||k==='s2') ? (parseInt(inp.value,10)||0) : inp.value;
        draw();
      });
    });
    matchesEl.querySelectorAll('.rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        const i = parseInt(btn.getAttribute('data-i'),10);
        matches.splice(i,1);
        renderRows(); draw();
      });
    });
  }
  function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

  document.getElementById('add').addEventListener('click', function(){
    if(matches.length >= 10) return;
    matches.push({t1:'', s1:0, s2:0, t2:''});
    renderRows(); draw();
  });
  titreEl.addEventListener('input', draw);
  soustitreEl.addEventListener('input', draw);

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function drawBlurCircle(cx,cy,r,color,blur){
    ctx.save();
    ctx.filter = 'blur('+blur+'px)';
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function fitCoverBG(img,dx,dy,dw,dh){
    const ir = img.width/img.height, dr = dw/dh;
    let sx,sy,sw,sh;
    if(ir > dr){ sh = img.height; sw = sh*dr; sy=0; sx=(img.width-sw)/2; }
    else { sw = img.width; sh = sw/dr; sx=0; sy=(img.height-sh)/2; }
    ctx.drawImage(img, sx,sy,sw,sh, dx,dy,dw,dh);
  }
  const flameImg = new Image();
  flameImg.onload = function(){ draw(); };

  function drawFlameIcon(cx,cy,hPx){
    if(!(flameImg.complete && flameImg.naturalWidth)) return;
    const ar = flameImg.naturalWidth / flameImg.naturalHeight;
    const h = hPx, w = h*ar;
    ctx.drawImage(flameImg, cx-w/2, cy-h/2, w, h);
  }
  function fitFont(text, maxW, start, min){
    let size = start;
    ctx.save();
    while(size > min){
      ctx.font = size + "px 'Anton'";
      if(ctx.measureText(text).width <= maxW) break;
      size -= 4;
    }
    ctx.restore();
    return size;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#060D1F';
    ctx.fillRect(0,0,W,H);

    if(bgImg.complete && bgImg.naturalWidth){
      fitCoverBG(bgImg,0,0,W,H);
    } else {
      const glow = ctx.createRadialGradient(W/2,H*0.14,0,W/2,H*0.14,W*0.62);
      glow.addColorStop(0,'rgba(64,146,255,0.4)');
      glow.addColorStop(1,'rgba(64,146,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0,0,W,H);
      drawBlurCircle(-60,-60,420,'rgba(140,200,255,0.5)',40);
      drawBlurCircle(W+60,-80,440,'rgba(140,200,255,0.45)',44);
      drawBlurCircle(-40,H+40,320,'rgba(90,170,255,0.35)',36);
      drawBlurCircle(W+40,H+60,340,'rgba(90,170,255,0.32)',36);
    }

    const darkOverlay = ctx.createLinearGradient(0,0,0,H);
    darkOverlay.addColorStop(0,'rgba(6,13,31,0.5)');
    darkOverlay.addColorStop(0.18,'rgba(6,13,31,0.28)');
    darkOverlay.addColorStop(0.85,'rgba(6,13,31,0.35)');
    darkOverlay.addColorStop(1,'rgba(6,13,31,0.6)');
    ctx.fillStyle = darkOverlay;
    ctx.fillRect(0,0,W,H);

    // top bar
    drawFlameIcon(70,58,38);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = "20px 'Anton'";
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('LE SOUFFLE BLEU', 96, 58);

    ctx.strokeStyle = '#4FA8FF';
    ctx.lineWidth = 2;
    roundRect(W-206,40,150,38,6);
    ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = "18px 'Anton'";
    ctx.textAlign='center';
    ctx.fillText('JA VICHY', W-131, 59);

    // title
    const titre = (titreEl.value || 'RÉSULTATS').toUpperCase();
    const size = fitFont(titre, 940, 100, 46);
    ctx.save();
    ctx.transform(1,0,-0.09,1,0,0);
    ctx.font = size + "px 'Anton'";
    ctx.fillStyle = '#EAFEFF';
    ctx.shadowColor = '#6FE3FF'; ctx.shadowBlur = 26;
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(titre, W/2 + size*0.16, 190);
    ctx.restore();

    ctx.shadowBlur = 0;
    if(soustitreEl.value){
      ctx.font = "22px 'Barlow'";
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.textAlign='center';
      ctx.fillText(soustitreEl.value, W/2, 232);
    }

    // rows
    const top = 280, bottom = 970;
    const n = Math.max(matches.length, 1);
    const rowH = Math.min(110, (bottom-top)/n);
    const teamFont = Math.max(20, Math.min(32, rowH*0.34));
    const scoreFont = Math.max(26, Math.min(44, rowH*0.44));

    matches.forEach(function(m, i){
      const cy = top + rowH*i + rowH/2;
      if(i % 2 === 0){
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        roundRect(48, cy-rowH/2+4, W-96, rowH-8, 12);
        ctx.fill();
      }
      const win1 = m.s1 > m.s2, win2 = m.s2 > m.s1;

      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.font = teamFont + "px 'Anton'";
      ctx.fillStyle = win1 ? '#EAFEFF' : 'rgba(255,255,255,0.55)';
      ctx.fillText(truncate(m.t1, 16), 76, cy);

      ctx.textAlign='right';
      ctx.fillStyle = win2 ? '#EAFEFF' : 'rgba(255,255,255,0.55)';
      ctx.fillText(truncate(m.t2, 16), W-76, cy);

      ctx.textAlign='center';
      ctx.font = scoreFont + "px 'Anton'";
      ctx.fillStyle = win1 ? '#6FE3FF' : '#EAFEFF';
      ctx.fillText(String(m.s1), W/2-38, cy);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = (scoreFont*0.6) + "px 'Barlow'";
      ctx.fillText('–', W/2, cy);
      ctx.font = scoreFont + "px 'Anton'";
      ctx.fillStyle = win2 ? '#6FE3FF' : '#EAFEFF';
      ctx.fillText(String(m.s2), W/2+38, cy);
    });

    // footer
    ctx.textAlign='center';
    drawFlameIcon(W/2,1044,26);
    ctx.font = "13px 'Anton'";
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText('LE SOUFFLE BLEU', W/2, 1070);
  }

  function truncate(s, n){ s = s || ''; return s.length > n ? s.slice(0,n-1)+'…' : s; }

  let downloadsCap = null;
  if(typeof claude !== 'undefined' && claude.use){
    try { downloadsCap = await claude.use('downloads'); } catch(e){}
  }

  document.getElementById('dl').addEventListener('click', function(){
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Préparation…';
    cv.toBlob(async function(blob){
      if(!blob){ statusEl.textContent = 'Erreur de génération.'; return; }
      const filename = 'souffle-bleu-resultats.png';
      if(downloadsCap){
        try{
          const res = await downloadsCap.save({filename: filename, data: blob});
          statusEl.textContent = res.status==='saved' ? 'Visuel enregistré.' : 'Visuel transmis.';
        } catch(err){
          statusEl.textContent = (err && err.code==='declined') ? '' : 'Le téléchargement a échoué.';
        }
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      statusEl.textContent = 'Visuel téléchargé.';
    }, 'image/png');
  });

  renderRows();
  if(document.fonts && document.fonts.ready){
    document.fonts.load("20px 'Anton'");
    document.fonts.load("20px 'Barlow'");
    document.fonts.ready.then(draw);
  }
  draw();
})();
